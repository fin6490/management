<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto-Dice Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  /* Layout: one scrolling column on phones; chart + stats left, control panel right on desktop. */
  :root {
    color-scheme: dark;
    --bg: #0b1220;        /* slate-950, blue-biased */
    --panel: #111a2e;
    --line: #22304d;
    --ink: #e2e8f0;
    --muted: #8b9ab5;
    --accent: #3b82f6;
    --win: #22c55e;
    --loss: #f43f5e;
    --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: var(--font-ui); -webkit-tap-highlight-color: transparent; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .label { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .field {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 0.5rem;
    padding: 0.6rem 0.7rem; color: var(--ink); font-family: var(--font-num); font-size: 16px; /* 16px stops iOS zoom */
    font-variant-numeric: tabular-nums;
  }
  .field:focus, select.field:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .field:disabled { opacity: 0.45; }
  select.field { font-family: var(--font-ui); appearance: none; padding-right: 2rem;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 2rem; }
  input[type=range]:disabled { opacity: 0.45; }
  .btn { border-radius: 0.6rem; padding: 0.85rem 0.5rem; font-weight: 700; font-size: 0.95rem; transition: filter .15s, transform .05s; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:hover:not(:disabled) { filter: brightness(1.12); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #chart { width: 100%; height: 100%; display: block; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="max-w-6xl mx-auto px-4 py-4 sm:py-6">

  <header class="flex items-baseline justify-between gap-3 mb-4">
    <h1 class="text-lg sm:text-xl font-extrabold tracking-tight">Auto-Dice <span class="text-blue-400">Simulator</span></h1>
    <span class="label">Fair odds · 0% edge</span>
  </header>

  <main class="grid gap-4 lg:grid-cols-[minmax(0,1fr)_360px] items-start">

    <!-- Visualization & stats -->
    <section class="flex flex-col gap-4 min-w-0">
      <div class="rounded-xl border p-3 sm:p-4" style="background:var(--panel);border-color:var(--line)">
        <div class="flex items-center justify-between mb-2">
          <span class="label">Balance vs. bets placed</span>
          <span id="lastRoll" class="num text-xs" style="color:var(--muted)">No rolls yet</span>
        </div>
        <div class="h-64 sm:h-80 lg:h-[26rem]"><canvas id="chart" aria-label="Balance chart" role="img"></canvas></div>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-px rounded-xl overflow-hidden border" style="background:var(--line);border-color:var(--line)">
        <div class="p-3" style="background:var(--panel)"><div class="label">Balance</div><div id="statBalance" class="num text-lg font-bold mt-1">0.00</div></div>
        <div class="p-3" style="background:var(--panel)"><div class="label">Profit / Loss</div><div id="statProfit" class="num text-lg font-bold mt-1">0.00</div></div>
        <div class="p-3" style="background:var(--panel)"><div class="label">Wagered</div><div id="statWagered" class="num text-lg font-bold mt-1">0.00</div></div>
        <div class="p-3" style="background:var(--panel)"><div class="label">Bets placed</div><div id="statBets" class="num text-lg font-bold mt-1">0</div></div>
      </div>
    </section>

    <!-- Controls -->
    <section class="rounded-xl border p-4 flex flex-col gap-5 min-w-0" style="background:var(--panel);border-color:var(--line)">

      <fieldset id="config" class="flex flex-col gap-5">
        <div class="grid grid-cols-2 gap-3">
          <label class="flex flex-col gap-1.5"><span class="label">Starting balance</span>
            <input id="startBalance" class="field" type="number" inputmode="decimal" min="0.01" step="0.01" value="100"></label>
          <label class="flex flex-col gap-1.5"><span class="label">Base bet</span>
            <input id="baseBet" class="field" type="number" inputmode="decimal" min="0.01" step="0.01" value="1"></label>
        </div>

        <div class="flex flex-col gap-1.5">
          <div class="flex items-end justify-between gap-3">
            <label for="chance" class="label">Win chance</label>
            <div class="text-right">
              <span class="label">Payout</span>
              <span id="multiplier" class="num text-blue-400 font-bold ml-1">2.0000×</span>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <input id="chance" type="range" min="0.01" max="99.99" step="0.01" value="50" class="flex-1 min-w-0">
            <div class="relative w-28 shrink-0">
              <input id="chanceNum" class="field pr-7" type="number" inputmode="decimal" min="0.01" max="99.99" step="0.01" value="50" aria-label="Win chance percent">
              <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-sm" style="color:var(--muted)">%</span>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-3">
          <div class="label" style="color:var(--ink)">Auto rules</div>
          <div class="grid grid-cols-[4.2rem_minmax(0,1fr)_5.5rem] items-center gap-2">
            <span class="text-sm font-semibold" style="color:var(--win)">On win</span>
            <select id="winAction" class="field" aria-label="On win action">
              <option value="same">Keep same</option>
              <option value="reset" selected>Reset to base</option>
              <option value="inc">Increase by %</option>
              <option value="dec">Decrease by %</option>
            </select>
            <div class="relative"><input id="winPct" class="field pr-6" type="number" inputmode="decimal" min="0" step="1" value="0" aria-label="On win percent"><span class="absolute right-2 top-1/2 -translate-y-1/2 text-sm" style="color:var(--muted)">%</span></div>

            <span class="text-sm font-semibold" style="color:var(--loss)">On loss</span>
            <select id="lossAction" class="field" aria-label="On loss action">
              <option value="same">Keep same</option>
              <option value="reset">Reset to base</option>
              <option value="inc" selected>Increase by %</option>
              <option value="dec">Decrease by %</option>
            </select>
            <div class="relative"><input id="lossPct" class="field pr-6" type="number" inputmode="decimal" min="0" step="1" value="100" aria-label="On loss percent"><span class="absolute right-2 top-1/2 -translate-y-1/2 text-sm" style="color:var(--muted)">%</span></div>
          </div>
        </div>

        <div class="flex flex-col gap-3">
          <div class="label" style="color:var(--ink)">Stop conditions <span class="normal-case tracking-normal font-normal" style="color:var(--muted)">(blank = off)</span></div>
          <div class="grid grid-cols-3 gap-2">
            <label class="flex flex-col gap-1.5"><span class="label">Balance ≥</span>
              <input id="stopProfit" class="field" type="number" inputmode="decimal" step="0.01" value="150"></label>
            <label class="flex flex-col gap-1.5"><span class="label">Balance ≤</span>
              <input id="stopLoss" class="field" type="number" inputmode="decimal" step="0.01" value="50"></label>
            <label class="flex flex-col gap-1.5"><span class="label">Max bets</span>
              <input id="maxBets" class="field" type="number" inputmode="numeric" step="1" min="1" value="1000"></label>
          </div>
        </div>
      </fieldset>

      <div class="flex flex-col gap-2">
        <div class="grid grid-cols-2 gap-2">
          <button id="startBtn" class="btn bg-green-600 text-white">Start AutoBet</button>
          <button id="stopBtn" class="btn bg-rose-600 text-white" disabled>Stop AutoBet</button>
          <button id="resetBtn" class="btn bg-slate-600 text-white col-span-2">Reset Data</button>
        </div>
        <p id="status" class="text-sm min-h-[1.25rem]" style="color:var(--muted)" aria-live="polite">Ready. Next bet: 1.00</p>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = {
    startBalance: $('startBalance'), baseBet: $('baseBet'), chance: $('chance'), chanceNum: $('chanceNum'),
    multiplier: $('multiplier'), winAction: $('winAction'), winPct: $('winPct'), lossAction: $('lossAction'),
    lossPct: $('lossPct'), stopProfit: $('stopProfit'), stopLoss: $('stopLoss'), maxBets: $('maxBets'),
    startBtn: $('startBtn'), stopBtn: $('stopBtn'), resetBtn: $('resetBtn'), status: $('status'), config: $('config'),
    statBalance: $('statBalance'), statProfit: $('statProfit'), statWagered: $('statWagered'), statBets: $('statBets'),
    lastRoll: $('lastRoll'), canvas: $('chart'),
  };

  const MIN_BET = 0.01;
  const TICK_MS = 50;
  const cents = x => Math.round(x * 100) / 100;
  const fmt = x => x.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = (input, fallback = NaN) => { const v = parseFloat(input.value); return Number.isFinite(v) ? v : fallback; };

  const state = { start: 100, balance: 100, bet: 1, base: 1, bets: 0, wagered: 0, history: [100], timer: null, busy: false };

  // ---------- config ----------
  function clampChance(v) { return Math.min(99.99, Math.max(0.01, v)); }
  function updateMultiplier() {
    const c = clampChance(num(el.chance, 50));
    el.multiplier.textContent = (100 / c).toFixed(4) + '×';
  }
  el.chance.addEventListener('input', () => { el.chanceNum.value = el.chance.value; updateMultiplier(); });
  el.chanceNum.addEventListener('input', () => {
    const v = num(el.chanceNum);
    if (Number.isFinite(v)) { el.chance.value = clampChance(v); updateMultiplier(); }
  });
  el.chanceNum.addEventListener('change', () => { el.chanceNum.value = clampChance(num(el.chanceNum, 50)).toFixed(2).replace(/\.?0+$/, ''); el.chance.value = el.chanceNum.value; updateMultiplier(); });

  function readConfig() {
    const start = num(el.startBalance), base = num(el.baseBet);
    if (!(start >= MIN_BET)) return { error: 'Starting balance must be at least 0.01.' };
    if (!(base >= MIN_BET)) return { error: 'Base bet must be at least 0.01.' };
    const opt = input => { const v = num(input); return Number.isFinite(v) ? v : null; };
    return {
      start: cents(start), base: cents(base), chance: clampChance(num(el.chance, 50)),
      win: { action: el.winAction.value, pct: Math.max(0, num(el.winPct, 0)) },
      loss: { action: el.lossAction.value, pct: Math.max(0, num(el.lossPct, 0)) },
      stopProfit: opt(el.stopProfit), stopLoss: opt(el.stopLoss), maxBets: opt(el.maxBets),
    };
  }

  // ---------- game logic ----------
  function applyRule(rule, bet, base) {
    switch (rule.action) {
      case 'reset': return base;
      case 'inc': return bet * (1 + rule.pct / 100);
      case 'dec': return bet * (1 - rule.pct / 100);
      default: return bet;
    }
  }
  function safeBet(bet) {
    bet = Math.max(MIN_BET, cents(bet));
    if (bet > state.balance) bet = state.balance; // all-in
    return cents(bet);
  }

  function placeBet(cfg) {
    const bet = safeBet(state.bet);
    const roll = Math.random() * 100;
    const win = roll <= cfg.chance;
    // Fair settlement: stake leaves the balance, a win returns stake × (100 / chance). EV = 0.
    state.balance -= bet;
    if (win) state.balance += bet * (100 / cfg.chance);
    state.balance = cents(state.balance);
    if (state.balance < MIN_BET) state.balance = 0;
    state.bets += 1;
    state.wagered += bet;
    state.history.push(state.balance);
    state.bet = applyRule(win ? cfg.win : cfg.loss, bet, cfg.base);
    if (state.balance > 0) state.bet = safeBet(state.bet);
    return { roll, win, bet };
  }

  function checkStop(cfg) {
    if (state.balance <= 0) return { msg: `BUST after ${state.bets.toLocaleString()} bets. Balance hit 0.`, tone: 'loss' };
    if (cfg.stopProfit !== null && state.balance >= cfg.stopProfit) return { msg: `Stop profit hit: balance ${fmt(state.balance)} ≥ ${fmt(cfg.stopProfit)}.`, tone: 'win' };
    if (cfg.stopLoss !== null && state.balance <= cfg.stopLoss) return { msg: `Stop loss hit: balance ${fmt(state.balance)} ≤ ${fmt(cfg.stopLoss)}.`, tone: 'loss' };
    if (cfg.maxBets !== null && state.bets >= cfg.maxBets) return { msg: `Max bets reached (${state.bets.toLocaleString()}).`, tone: 'muted' };
    return null;
  }

  // ---------- engine ----------
  let activeCfg = null;
  function setStatus(msg, tone = 'muted') {
    el.status.textContent = msg;
    el.status.style.color = tone === 'win' ? 'var(--win)' : tone === 'loss' ? 'var(--loss)' : tone === 'ink' ? 'var(--ink)' : 'var(--muted)';
  }
  function setRunning(on) {
    el.config.disabled = on;
    el.startBtn.disabled = on;
    el.stopBtn.disabled = !on;
    el.resetBtn.disabled = on;
  }

  function start() {
    const cfg = readConfig();
    if (cfg.error) return setStatus(cfg.error, 'loss');
    // Fresh session if nothing has been played or the previous one went bust.
    if (state.bets === 0 || state.balance <= 0) resetData(cfg);
    else { state.base = cfg.base; }
    if (state.balance <= 0) return setStatus('Balance is 0. Press Reset to start again.', 'loss');
    const pre = checkStop(cfg);
    if (pre) return setStatus('Already past a stop condition. ' + pre.msg, pre.tone);
    activeCfg = cfg;
    setRunning(true);
    setStatus('Running…', 'ink');
    state.timer = setInterval(tick, TICK_MS);
  }

  function stop(msg, tone) {
    clearInterval(state.timer);
    state.timer = null;
    setRunning(false);
    setStatus(msg || `Stopped by you after ${state.bets.toLocaleString()} bets.`, tone || 'muted');
  }

  function tick() {
    const r = placeBet(activeCfg);
    el.lastRoll.textContent = `Roll ${r.roll.toFixed(2)} · ${r.win ? 'WIN' : 'LOSS'} ${fmt(r.bet)}`;
    el.lastRoll.style.color = r.win ? 'var(--win)' : 'var(--loss)';
    render();
    const s = checkStop(activeCfg);
    if (s) stop(s.msg, s.tone);
    else setStatus(`Running… next bet ${fmt(state.bet)}`, 'ink');
  }

  function resetData(cfg = readConfig()) {
    const start = cfg.error ? 100 : cfg.start, base = cfg.error ? 1 : cfg.base;
    Object.assign(state, { start, balance: start, base, bets: 0, wagered: 0, history: [start] });
    state.bet = safeBet(base);
    el.lastRoll.textContent = 'No rolls yet';
    el.lastRoll.style.color = 'var(--muted)';
    render();
  }

  el.startBtn.addEventListener('click', start);
  el.stopBtn.addEventListener('click', () => stop());
  el.resetBtn.addEventListener('click', () => { resetData(); setStatus(`Data reset. Next bet: ${fmt(state.bet)}`); });
  // Reflect config edits immediately while idle and untouched.
  [el.startBalance, el.baseBet].forEach(i => i.addEventListener('input', () => {
    if (!state.timer && state.bets === 0) { resetData(); setStatus(`Ready. Next bet: ${fmt(state.bet)}`); }
  }));

  // ---------- rendering ----------
  function renderStats() {
    const pl = state.balance - state.start;
    el.statBalance.textContent = fmt(state.balance);
    el.statProfit.textContent = (pl > 0 ? '+' : '') + fmt(pl);
    el.statProfit.style.color = pl > 0.004 ? 'var(--win)' : pl < -0.004 ? 'var(--loss)' : 'var(--ink)';
    el.statWagered.textContent = fmt(state.wagered);
    el.statBets.textContent = state.bets.toLocaleString();
  }

  const ctx = el.canvas.getContext('2d');
  function niceStep(range, target) {
    const raw = range / target, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
  }
  function shortNum(v) {
    const a = Math.abs(v);
    if (a >= 1e9) return (v / 1e9).toFixed(1) + 'B';
    if (a >= 1e6) return (v / 1e6).toFixed(1) + 'M';
    if (a >= 1e4) return (v / 1e3).toFixed(1) + 'k';
    return a >= 100 ? v.toFixed(0) : v.toFixed(2).replace(/\.00$/, '');
  }

  function drawChart() {
    const dpr = window.devicePixelRatio || 1;
    const w = el.canvas.clientWidth, h = el.canvas.clientHeight;
    if (!w || !h) return;
    if (el.canvas.width !== Math.round(w * dpr) || el.canvas.height !== Math.round(h * dpr)) {
      el.canvas.width = Math.round(w * dpr); el.canvas.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const css = getComputedStyle(document.documentElement);
    const C = k => css.getPropertyValue(k).trim();
    const hist = state.history, n = hist.length;

    let lo = state.start, hi = state.start;
    for (let i = 0; i < n; i++) { if (hist[i] < lo) lo = hist[i]; if (hist[i] > hi) hi = hist[i]; }
    const span = Math.max(hi - lo, state.start * 0.1, 0.1);
    lo = Math.max(0, lo - span * 0.1); hi = hi + span * 0.1;
    const step = niceStep(hi - lo, 5);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;

    ctx.font = `11px ${C('--font-num')}`;
    const labelW = Math.max(ctx.measureText(shortNum(hi)).width, ctx.measureText(shortNum(lo)).width);
    const pad = { l: labelW + 12, r: 10, t: 10, b: 24 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const maxX = Math.max(n - 1, 1);
    const X = i => pad.l + (i / maxX) * pw;
    const Y = v => pad.t + (1 - (v - lo) / (hi - lo)) * ph;

    // grid + y labels
    ctx.strokeStyle = C('--line'); ctx.lineWidth = 1; ctx.fillStyle = C('--muted');
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let v = lo; v <= hi + step / 2; v += step) {
      const y = Math.round(Y(v)) + 0.5;
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
      ctx.fillText(shortNum(v), pad.l - 6, y);
    }
    // x labels
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const xs = niceStep(maxX, Math.max(2, Math.floor(pw / 70)));
    for (let i = 0; i <= maxX; i += Math.max(1, xs)) {
      const x = X(i);
      ctx.fillText(i.toLocaleString(), Math.min(Math.max(x, pad.l + 8), w - pad.r - 12), h - pad.b + 7);
    }

    // points: downsample to ~2 per pixel, keeping min & max so spikes survive
    const pts = [];
    const bucket = Math.max(1, Math.floor(n / (pw * 2)));
    if (bucket === 1) for (let i = 0; i < n; i++) pts.push([i, hist[i]]);
    else {
      for (let s = 0; s < n; s += bucket) {
        let mi = s, ma = s;
        for (let i = s; i < Math.min(n, s + bucket); i++) { if (hist[i] < hist[mi]) mi = i; if (hist[i] > hist[ma]) ma = i; }
        if (mi < ma) pts.push([mi, hist[mi]], [ma, hist[ma]]); else if (mi > ma) pts.push([ma, hist[ma]], [mi, hist[mi]]); else pts.push([mi, hist[mi]]);
      }
      if (pts[pts.length - 1][0] !== n - 1) pts.push([n - 1, hist[n - 1]]);
    }
    if (n === 1) pts.push([1, hist[0]]);

    const up = hist[n - 1] >= state.start;
    const lineColor = n === 1 ? C('--accent') : up ? C('--win') : C('--loss');

    // gradient area
    const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ph);
    grad.addColorStop(0, hexA(C('--accent'), 0.35));
    grad.addColorStop(1, hexA(C('--accent'), 0));
    ctx.beginPath();
    ctx.moveTo(X(pts[0][0]), Y(pts[0][1]));
    for (const [i, v] of pts) ctx.lineTo(X(i), Y(v));
    ctx.lineTo(X(pts[pts.length - 1][0]), pad.t + ph);
    ctx.lineTo(X(pts[0][0]), pad.t + ph);
    ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

    // starting balance reference
    const sy = Math.round(Y(state.start)) + 0.5;
    ctx.setLineDash([5, 5]); ctx.strokeStyle = C('--muted'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, sy); ctx.lineTo(w - pad.r, sy); ctx.stroke(); ctx.setLineDash([]);

    // balance line
    ctx.beginPath();
    pts.forEach(([i, v], k) => k ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
    ctx.strokeStyle = C('--accent'); ctx.lineWidth = 1.75; ctx.lineJoin = 'round'; ctx.stroke();

    // endpoint
    const ex = X(pts[pts.length - 1][0]), ey = Y(hist[n - 1]);
    ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI * 2); ctx.fillStyle = lineColor; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = C('--panel'); ctx.stroke();

    // start label chip, drawn last so the line never covers it
    const tag = 'start ' + shortNum(state.start), tw = ctx.measureText(tag).width + 10;
    const tx = w - pad.r - tw, ty = Math.min(Math.max(sy - 8, pad.t), pad.t + ph - 16);
    ctx.fillStyle = C('--panel'); ctx.strokeStyle = C('--line'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(tx, ty, tw, 16, 4) : ctx.rect(tx, ty, tw, 16); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C('--muted'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(tag, tx + 5, ty + 8.5);
  }
  function hexA(hex, a) {
    const m = hex.replace('#', '');
    const v = parseInt(m.length === 3 ? m.split('').map(c => c + c).join('') : m, 16);
    return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
  }

  let raf = 0;
  function render() { renderStats(); if (!raf) raf = requestAnimationFrame(() => { raf = 0; drawChart(); }); }
  new ResizeObserver(() => drawChart()).observe(el.canvas);

  updateMultiplier();
  resetData();
})();
</script>
</body>
